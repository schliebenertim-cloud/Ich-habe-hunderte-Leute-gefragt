<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ich habe hunderte Leute gefragt</title>
<style>
:root{--bg:#0e0f1f;--card:#1c1e3a;--tx:#fff;--mute:#5a5d7a;--bd:#34376a;--ac:#6c8cff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#17171c;--card:#25252d;--tx:#f1f1f4;--mute:#6d6d78;--bd:#3a3a45;--ac:#7fa2ff;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:clamp(20px,3vw,30px);margin:0 0 10px;text-align:center}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:12px;font-size:13px}
button,select,input{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
input,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;min-width:0}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.team{border-radius:14px;padding:10px 12px;color:#fff;position:relative;text-align:center}
.team.out{background:var(--mute)!important}
.team .nm{font-weight:700;font-size:1.05em}.team.out .nm{text-decoration:line-through}
.team .sc{font-size:2.2em;font-weight:800;line-height:1.1}
.hearts{font-size:1.5em;letter-spacing:3px}.h{font-weight:400}.h.x{color:rgba(255,255,255,.35)}.team.out .h{color:rgba(255,255,255,.3)}
.cross{position:absolute;right:10px;top:4px;font-size:2em;font-weight:800;color:#fff}
.team .ctl{display:flex;gap:6px;justify-content:center;margin-top:6px}.team .ctl button{padding:4px 9px;font-size:13px}
.q{text-align:center;font-size:clamp(20px,3.2vw,36px);margin:6px 0 12px}
.board{display:grid;gap:8px}
.row{display:grid;grid-template-columns:3.2em 1fr 4em;align-items:center;gap:8px;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:clamp(18px,2.6vw,30px);min-height:2.2em;transition:background .3s}
.row.on{color:#fff;border-color:transparent;font-weight:700}
.row .n{font-weight:800;opacity:.6}.row .p{text-align:right;font-weight:800}
.row i{opacity:.4;font-weight:400;font-style:normal;font-size:.8em}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px 4px}.btns button{color:#fff;border:0;font-size:13px;padding:6px 10px}
.btns button.no{background:var(--mute)}.btns button.un{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.ed .qb{border-top:1px solid var(--bd);padding-top:10px;margin-top:10px}.ed .ar{display:grid;grid-template-columns:2em 1fr 5em;gap:6px;margin:4px 0}.ed .ar span{align-self:center;opacity:.6}
.ed label{display:block;font-size:13px;opacity:.8;margin:6px 0 2px}.ed .full{width:100%}
.tr{display:flex;gap:8px;margin:5px 0;align-items:center}.tr input[type=color]{padding:0;width:44px;height:34px}.tr input[type=text]{flex:1}
.note{text-align:center;font-size:13px;opacity:.7;margin:8px}
.disp .team .sc{font-size:clamp(28px,5vw,60px)}.disp .team .nm{font-size:clamp(16px,2.4vw,28px)}.disp .hearts{font-size:clamp(22px,3.4vw,40px)}
body{background:radial-gradient(circle at top,#202458,#0e0f1f 65%) fixed}
.hearts{font-size:2.4em;letter-spacing:4px}.disp .hearts{font-size:clamp(34px,5vw,64px)}
.h.a{display:inline-block;animation:beat 1.6s ease-in-out infinite}.h.lose{display:inline-block;animation:lose .9s}
.cross{animation:pop .6s}.row.flip{animation:flip .6s}
.team{box-shadow:0 6px 18px rgba(0,0,0,.4)}.team.turn{animation:glow 1s infinite alternate;transform:scale(1.04)}
.sc{display:inline-block}.sc.bump{animation:bump .35s infinite alternate;text-shadow:0 0 18px #ffe66d}
.plus{position:absolute;left:50%;top:45%;font-size:2.4em;font-weight:900;color:#ffe66d;pointer-events:none;text-shadow:0 2px 10px #000;animation:fly 1.5s forwards}
.turnb{text-align:center;color:#fff;font-weight:800;font-size:clamp(18px,3vw,32px);border-radius:12px;padding:10px;margin-bottom:12px;animation:pop .5s}
.crown{text-align:center;font-size:2.4em;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.18)}}@keyframes pop{from{transform:scale(0)}70%{transform:scale(1.3)}to{transform:scale(1)}}
@keyframes lose{0%{transform:scale(1.9) rotate(0)}40%{transform:scale(1.3) rotate(-25deg)}70%{transform:scale(.7) rotate(15deg)}100%{transform:scale(1)}}
@keyframes flip{from{transform:rotateX(90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{to{transform:scale(1.25)}}@keyframes glow{to{box-shadow:0 0 28px 6px rgba(255,255,255,.75)}}
@keyframes fly{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-100px) scale(1.5)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var push=function(){},MAXL=3,MODE="ctl",VIEW="play",S=null,DRAFT=null,DB=null,SYNC=false,CONFIRM=false;
var DEF={questions:[{q:"Nenne eine Frucht.",a:[["Apfel",26],["Birne",15],["Banane",12],["Erdbeere",9],["Orange",7]]}],
teams:[{n:"Team 1",c:"#e63946",l:3,s:0},{n:"Team 2",c:"#2a7de1",l:3,s:0}],cur:0,rev:{},done:false};
var PAL=["#e63946","#2a7de1","#2a9d4b","#d97706"];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function clone(o){return JSON.parse(JSON.stringify(o))}
try{var m=localStorage.getItem("ihlg-mode");if(m)MODE=m;var ls=localStorage.getItem("ihlg-state");S=ls?JSON.parse(ls):null}catch(e){}
if(!S)S=clone(DEF);
function save(){
  render();
  try{localStorage.setItem("ihlg-state",JSON.stringify(S))}catch(e){}
  if(MODE!=="disp")push()
}
function setMode(m){MODE=m;VIEW="play";try{localStorage.setItem("ihlg-mode",m)}catch(e){}render()}
function team(t,ctl){
  var out=t.l<=0,h="";
  for(var i=0;i<MAXL;i++)h+='<b class="h'+(i<t.l?"":" x")+'">♥</b>';
  return '<div class="team'+(out?" out":"")+'" style="background:'+t.c+'">'+(out?'<span class="cross">✗</span>':"")+
   '<div class="nm">'+esc(t.n)+'</div><div class="hearts">'+h+'</div><div class="sc">'+t.s+'</div>'+
   (ctl?'<div class="ctl"><button data-a="life" data-t="'+t._i+'" data-d="-1">− ♥</button><button data-a="life" data-t="'+t._i+'" data-d="1">+ ♥</button></div>':"")+'</div>';
}
function teams(ctl){return '<div class="teams">'+S.teams.map(function(t,i){t._i=i;return team(t,ctl)}).join("")+"</div>"}
function board(ctl){
  var Q=S.questions[S.cur];if(!Q)return '<p class="note">Noch keine Fragen angelegt.</p>';
  var h='<h2 class="q">'+esc(Q.q)+'</h2><div class="board">';
  Q.a.forEach(function(x,i){
    var r=S.rev[i],has=r!==undefined,t=has&&r>=0?S.teams[r]:null;
    var bg=has?"background:"+(t?t.c:"var(--mute)"):"";
    h+='<div><div class="row'+(has?" on":"")+'" style="'+bg+'"><span class="n">'+(i+1)+'</span><span class="a">'+
      (has?esc(x[0]):(ctl?"<i>"+esc(x[0])+"</i>":""))+'</span><span class="p">'+(has?x[1]:(ctl?"<i>"+x[1]+"</i>":""))+"</span></div>";
    if(ctl){
      h+='<div class="btns">';
      if(!has){
        S.teams.forEach(function(tm,ti){if(tm.l>0)h+='<button style="background:'+tm.c+'" data-a="rev" data-i="'+i+'" data-t="'+ti+'">'+esc(tm.n)+'</button>'});
        h+='<button class="no" data-a="rev" data-i="'+i+'" data-t="-1">niemand</button>';
      }else if(!S.done)h+='<button class="un" data-a="unrev" data-i="'+i+'">↩ zurücknehmen</button>';
      h+="</div>";
    }
    h+="</div>";
  });
  return h+"</div>";
}
function allRev(){var Q=S.questions[S.cur];return Q&&Q.a.every(function(_,i){return S.rev[i]!==undefined})}
function syncTag(){return '<span>'+(SYNC?"● synchronisiert":"○ nur lokal (keine Synchronisation)")+"</span>"}
function render(){
  var app=document.getElementById("app");
  if(MODE==="disp"){
    app.className="disp";
    app.innerHTML='<h1>Ich habe hunderte Leute gefragt</h1>'+teams(false)+board(false)+
      '<div class="note"><button data-a="mode" data-m="ctl">Steuerung</button> '+syncTag()+"</div>";return;
  }
  app.className="";
  if(VIEW==="edit"){renderEdit();return}
  var opts=S.questions.map(function(q,i){return '<option value="'+i+'"'+(i===S.cur?" selected":"")+">"+(i+1)+". "+esc(q.q.slice(0,40))+"</option>"}).join("");
  app.innerHTML='<h1>Ich habe hunderte Leute gefragt</h1>'+
   '<div class="bar"><button data-a="edit">✎ Fragen &amp; Teams</button><button data-a="mode" data-m="disp">📺 Dieses Gerät = Anzeige</button>'+
   '<select data-a="jump">'+opts+'</select>'+syncTag()+"</div>"+teams(true)+board(true)+
   '<div class="bar" style="margin-top:14px"><button class="pri" data-a="finish"'+(allRev()&&!S.done?"":" disabled")+'>Runde abschließen &amp; Punkte verteilen</button>'+
   '<button data-a="next"'+(S.done&&S.cur<S.questions.length-1?"":" disabled")+'>Nächste Frage →</button>'+
   '<button data-a="reset">'+(CONFIRM?"Wirklich alles zurücksetzen?":"Spiel zurücksetzen")+"</button></div>"+
   '<div class="note">'+(S.done?"Runde abgeschlossen – Punkte sind verbucht.":"Punkte werden erst nach „Runde abschließen“ verteilt.")+
   (S.done&&S.cur>=S.questions.length-1?" Das war die letzte Frage.":"")+"</div>";
}
function renderEdit(){
  var D=DRAFT,h='<h1>Fragen &amp; Teams</h1><div class="ed"><div class="panel"><b>Teams</b><label>Anzahl (2–4)</label><select data-f="tcount">';
  for(var n=2;n<=4;n++)h+='<option'+(D.teams.length===n?" selected":"")+">"+n+"</option>";
  h+="</select>";
  D.teams.forEach(function(t,i){h+='<div class="tr"><input type="color" data-f="tc" data-t="'+i+'" value="'+t.c+'"><input type="text" data-f="tn" data-t="'+i+'" value="'+esc(t.n)+'"></div>'});
  h+="</div>";
  D.questions.forEach(function(q,qi){
    h+='<div class="panel qb"><label>Frage '+(qi+1)+'</label><input class="full" type="text" data-f="q" data-q="'+qi+'" value="'+esc(q.q)+'">'+
      '<label>Anzahl Antworten (1–10)</label><select data-f="rows" data-q="'+qi+'">';
    for(var n=1;n<=10;n++)h+="<option"+(q.a.length===n?" selected":"")+">"+n+"</option>";
    h+="</select>";
    q.a.forEach(function(x,ai){h+='<div class="ar"><span>'+(ai+1)+'.</span><input type="text" placeholder="Antwort" data-f="a" data-q="'+qi+'" data-i="'+ai+'" value="'+esc(x[0])+'"><input type="number" placeholder="Punkte" data-f="p" data-q="'+qi+'" data-i="'+ai+'" value="'+x[1]+'"></div>'});
    h+='<button data-a="delq" data-q="'+qi+'">Frage löschen</button></div>';
  });
  h+='<div class="bar" style="margin-top:12px"><button data-a="addq">+ Frage hinzufügen</button><button class="pri" data-a="saveedit">Speichern</button><button data-a="canceledit">Abbrechen</button></div></div>';
  document.getElementById("app").innerHTML=h;
}
function fixRows(q,n){while(q.a.length<n)q.a.push(["",0]);q.a.length=n}
document.addEventListener("input",function(e){
  var d=e.target.dataset;if(!d||!d.f||!DRAFT)return;var D=DRAFT;
  if(d.f==="q")D.questions[+d.q].q=e.target.value;
  else if(d.f==="a")D.questions[+d.q].a[+d.i][0]=e.target.value;
  else if(d.f==="p")D.questions[+d.q].a[+d.i][1]=Number(e.target.value)||0;
  else if(d.f==="tn")D.teams[+d.t].n=e.target.value;
  else if(d.f==="tc")D.teams[+d.t].c=e.target.value;
});
document.addEventListener("change",function(e){
  var d=e.target.dataset;if(!d)return;
  if(d.a==="jump"){S.cur=+e.target.value;S.rev={};S.done=false;S.teams.forEach(function(t){t.l=MAXL});save();return}
  if(!DRAFT)return;
  if(d.f==="rows"){fixRows(DRAFT.questions[+d.q],+e.target.value);renderEdit()}
  else if(d.f==="tcount"){var n=+e.target.value;while(DRAFT.teams.length<n){var i=DRAFT.teams.length;DRAFT.teams.push({n:"Team "+(i+1),c:PAL[i],l:MAXL,s:0})}DRAFT.teams.length=n;renderEdit()}
});
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset,a=d.a;if(!a)return;
  if(a!=="reset")CONFIRM=false;
  if(a==="mode")setMode(d.m);
  else if(a==="rev"){S.rev[+d.i]=+d.t;save()}
  else if(a==="unrev"){delete S.rev[+d.i];save()}
  else if(a==="life"){var t=S.teams[+d.t];t.l=Math.max(0,Math.min(MAXL,t.l+Number(d.d)));save()}
  else if(a==="finish"){Object.keys(S.rev).forEach(function(i){var r=S.rev[i];if(r>=0)S.teams[r].s+=S.questions[S.cur].a[+i][1]});S.done=true;save()}
  else if(a==="next"){S.cur++;S.rev={};S.done=false;S.teams.forEach(function(t){t.l=MAXL});save()}
  else if(a==="reset"){
    if(!CONFIRM){CONFIRM=true;render();return}
    CONFIRM=false;S.teams.forEach(function(t){t.l=MAXL;t.s=0});S.cur=0;S.rev={};S.done=false;save();
  }
  else if(a==="edit"){DRAFT=clone({questions:S.questions,teams:S.teams});VIEW="edit";render()}
  else if(a==="addq"){DRAFT.questions.push({q:"",a:[["",0],["",0],["",0]]});renderEdit()}
  else if(a==="delq"){DRAFT.questions.splice(+d.q,1);renderEdit()}
  else if(a==="canceledit"){DRAFT=null;VIEW="play";render()}
  else if(a==="saveedit"){
    S.questions=DRAFT.questions;
    S.teams=DRAFT.teams.map(function(t,i){var o=S.teams[i];return{n:t.n||"Team "+(i+1),c:t.c,l:o?o.l:MAXL,s:o?o.s:0}});
    if(S.cur>=S.questions.length)S.cur=Math.max(0,S.questions.length-1);
    var Q=S.questions[S.cur];Object.keys(S.rev).forEach(function(i){if(!Q||+i>=Q.a.length||S.rev[i]>=S.teams.length)delete S.rev[i]});
    DRAFT=null;VIEW="play";save();
  }
});
var LASTS={},LASTL={},SEEN={};
function FQ(){var r=[];S.questions.forEach(function(q,i){if(q.f)r.push(i)});return r}
function cq(){var f=S.fin;if(f&&f.on)return{Q:S.questions[FQ()[f.pos]],rev:f.rev,key:"f"+f.pos};return{Q:S.questions[S.cur],rev:S.rev,key:"n"+S.cur}}
team=function(t,ctl){var i=t._i,fin=S.fin&&S.fin.on,out=t.l<=0&&!fin,h="",pl=LASTL[i];
 if(!fin){for(var k=0;k<MAXL;k++)h+='<b class="h '+(k<t.l?"a":"x")+(pl!==undefined&&k>=t.l&&k<pl?" lose":"")+'">♥</b>';LASTL[i]=t.l}
 var turn=fin&&S.fin.order[S.fin.turn]===i;
 return '<div class="team'+(out?" out":"")+(turn?" turn":"")+'" style="background:'+t.c+'">'+(out?'<span class="cross">✗</span>':"")+'<div class="nm">'+esc(t.n)+'</div>'+(fin?"":'<div class="hearts">'+h+'</div>')+'<div class="sc" data-i="'+i+'">'+(LASTS[i]===undefined?t.s:LASTS[i])+'</div>'+(ctl?'<div class="ctl"><button data-a="life" data-t="'+i+'" data-d="-1">− ♥</button><button data-a="life" data-t="'+i+'" data-d="1">+ ♥</button></div>':"")+'</div>'};
board=function(ctl){var c=cq(),Q=c.Q;if(!Q)return '<p class="note">Noch keine Fragen angelegt.</p>';
 var fin=S.fin&&S.fin.on,cur=fin?S.fin.order[S.fin.turn]:undefined;
 var h='<h2 class="q">'+esc(Q.q)+'</h2><div class="board">';
 Q.a.forEach(function(x,i){var r=c.rev[i],has=r!==undefined,t=has&&r>=0?S.teams[r]:null,k=c.key+"-"+i,fl=has&&!SEEN[k]?" flip":"";if(has)SEEN[k]=1;
  h+='<div><div class="row'+(has?" on":"")+fl+'" style="'+(has?"background:"+(t?t.c:"var(--mute)"):"")+'"><span class="n">'+(i+1)+'</span><span class="a">'+(has?esc(x[0]):(ctl?"<i>"+esc(x[0])+"</i>":""))+'</span><span class="p">'+(has?x[1]:(ctl?"<i>"+x[1]+"</i>":""))+'</span></div>';
  if(ctl){h+='<div class="btns">';
   if(fin){if(!has&&cur!==undefined)h+='<button style="background:'+S.teams[cur].c+'" data-a="frev" data-i="'+i+'">✔ '+esc(S.teams[cur].n)+' hat das gesagt</button>'}
   else if(!has){S.teams.forEach(function(tm,ti){if(tm.l>0)h+='<button style="background:'+tm.c+'" data-a="rev" data-i="'+i+'" data-t="'+ti+'">'+esc(tm.n)+'</button>'});h+='<button class="no" data-a="rev" data-i="'+i+'" data-t="-1">niemand</button>'}
   else if(!S.done)h+='<button class="un" data-a="unrev" data-i="'+i+'">↩ zurücknehmen</button>';
   h+='</div>'}
  h+='</div>'});
 return h+'</div>'};
function renderFinal(){var f=S.fin,ctl=MODE!=="disp",fq=FQ(),app=document.getElementById("app"),h;app.className=ctl?"":"disp";
 if(f.end){var o=S.teams.map(function(t,i){t._i=i;return t}).sort(function(a,b){return b.s-a.s});
  h='<h1>🏆 Endstand</h1><div class="teams">'+o.map(function(t,k){return '<div>'+(k===0?'<div class="crown">👑</div>':'')+team(t,false)+'</div>'}).join("")+'</div><div class="note"><button data-a="fexit">Finale verlassen</button></div>';
 }else{var over=f.turn>=f.order.length,c=f.order[f.turn];
  h='<h1>🏆 Finale – Frage '+(f.pos+1)+' von '+fq.length+'</h1>'+teams(false)+(over?'<div class="turnb" style="background:var(--card)">Alle Teams waren dran</div>':'<div class="turnb" style="background:'+S.teams[c].c+'">'+esc(S.teams[c].n)+' ist dran</div>')+board(ctl);
  h+=ctl?'<div class="bar" style="margin-top:14px"><button data-a="fskip"'+(over?" disabled":"")+'>✗ Falsch / keine Antwort</button><button data-a="frest"'+(over?"":" disabled")+'>Rest aufdecken</button><button class="pri" data-a="fnext"'+(over?"":" disabled")+'>'+(f.pos>=fq.length-1?"Finale beenden":"Nächste Finalfrage →")+'</button><button data-a="mode" data-m="disp">📺 Anzeige</button></div>':'<div class="note"><button data-a="mode" data-m="ctl">Steuerung</button></div>';}
 app.innerHTML=h}
function fx(){document.querySelectorAll(".sc").forEach(function(el){var i=+el.dataset.i,to=S.teams[i].s,from=LASTS[i];LASTS[i]=to;if(from===undefined||from===to){el.textContent=to;return}
 var t0=performance.now();el.classList.add("bump");
 if(to>from){var fl=document.createElement("div");fl.className="plus";fl.textContent="+"+(to-from);el.parentNode.appendChild(fl);setTimeout(function(){fl.remove()},1600)}
 (function f(n){var k=Math.min(1,(n-t0)/1400);k=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f);else el.classList.remove("bump")})(t0)})}
var _r=render;render=function(){var ed=VIEW==="edit"&&MODE!=="disp";
 if(S.fin&&S.fin.on&&!ed)renderFinal();else{_r();if(!ed&&MODE!=="disp"){var bar=document.querySelector(".bar");if(bar)bar.insertAdjacentHTML("afterbegin",'<button data-a="fstart"'+(FQ().length?"":' disabled title="Erst Fragen als Finalfrage markieren"')+'>🏆 Finale starten</button>')}}
 fx()};
var _re=renderEdit;renderEdit=function(){_re();document.querySelectorAll(".qb").forEach(function(p,i){var q=DRAFT.questions[i],l=document.createElement("label");l.innerHTML='<input type="checkbox" data-f="fq" data-q="'+i+'"'+(q.f?" checked":"")+'> Finalfrage';p.insertBefore(l,p.querySelector("button"))})};
document.addEventListener("change",function(e){var d=e.target.dataset;if(d&&d.f==="fq"&&DRAFT)DRAFT.questions[+d.q].f=e.target.checked});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b||!b.dataset.a)return;var a=b.dataset.a,f=S.fin;
